# SPDX-License-Identifier: GPL-3.0-or-later
#
# Self-hosted-runner smoke-proof (tagwright CI runner rollout, task #554 / #571).
#
# This runs IN PARALLEL with ci.yml's ubuntu-latest build; it does not replace or
# touch it. It targets the self-hosted tagwright runner whose labels are exactly
# tagwright,dind,self-hosted, and whose job environment already points DOCKER_HOST
# at its own isolated privileged dind over TLS.
#
# ARCHITECTURAL RULE for this runner: do NOT use `container:`. The runner's docker
# is a REMOTE dind (a separate daemon over DOCKER_HOST/TLS, no shared filesystem),
# and GitHub `container:` jobs bind-mount the runner's _work workspace into the job
# container, which a remote dind cannot see, so a container job breaks early. Any
# toolchain a leg needs is installed ON THE HOST instead, the way the Go legs use
# actions/setup-go. bathyscaphe is Rust/aya, so it installs rust on the host via
# setup-rust-toolchain (the setup-go equivalent) and adds nightly + rust-src for
# the eBPF cross-compile.
#
# It proves two things: that a real job is picked up by the runner AND can reach
# its isolated dind (the docker step), and that bathyscaphe's two-toolchain build
# (stable userspace + nightly no_std eBPF cross-compile via bpf-linker) succeeds on
# the runner. It deliberately skips cargo test: the privileged eBPF live-
# integration harness is a separate deeper task, not this smoke leg.
#
# Reversible: delete this file to remove the self-hosted leg entirely.

name: CI (self-hosted)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger, so the self-hosted smoke leg can be re-run from the Actions
  # UI without a code push (there is no other way to re-run a self-hosted job
  # that was cancelled or wedged). Matches the ballast pilot.
  workflow_dispatch:

env:
  BPF_LINKER_VERSION: "0.11.0"

jobs:
  build-selfhosted:
    # Must match the runner's LABELS set exactly (tagwright,dind,self-hosted).
    runs-on: [self-hosted, tagwright, dind]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prove the isolated dind is reachable over TLS
        # docker info needs a live daemon connection, so a green step here proves
        # the job reached its scratch dind over DOCKER_HOST/TLS (no host socket).
        run: |
          docker version
          docker info

      - name: Install Rust on the host (stable)
        # setup-rust-toolchain installs rustup + the toolchain on the runner host
        # (the lean runner ships only node), the Rust counterpart to setup-go.
        # rustflags is set empty on purpose: the action otherwise injects
        # RUSTFLAGS="-D warnings", which would fail the build on bathyscaphe's
        # known, documented dead_code warnings (see ci.yml).
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Add nightly + rust-src
        # aya-build cross-compiles the no_std eBPF crate on nightly from a
        # userspace build.rs; rust-src is required for the -Z build-std it uses.
        run: rustup toolchain install nightly --component rust-src

      - name: Install bpf-linker (prebuilt musl release, not `cargo install`)
        # Jobs run as root on the host, so no sudo; zstd is not preinstalled.
        run: |
          apt-get update -qq
          apt-get install -y -qq zstd curl
          curl -sL -o /tmp/bpf-linker.tar.zst \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          tar --zstd -C /tmp -xf /tmp/bpf-linker.tar.zst
          install -m 0755 /tmp/bpf-linker /usr/local/bin/bpf-linker

      - name: Build
        # One cargo build at the workspace root builds the stable userspace crates
        # and, via bathyscaphe/build.rs (aya-build), cross-compiles the no_std eBPF
        # crate on nightly through bpf-linker. See docs/BUILDING.md.
        run: cargo build --locked
